[package]
name = "box_engine"
version = "0.1.0"
edition = "2021"
description = "Box-set optimizer engine (packer, cost model, p-median optimizer)"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
js-sys = "0.3"

[dev-dependencies]
proptest = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

# Keep the target dir small (no debug info in dev/test builds).
[profile.dev]
debug = 0

[profile.test]
debug = 0
